name: Deploy to Staging

# Every merge to master deploys to staging automatically. To preview a
# feature branch on staging before merging, run this workflow manually
# (Actions → Deploy to Staging → Run workflow, or
# `gh workflow run deploy-staging.yml --ref <branch>`); the next push to
# master will put staging back on master.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Only one staging deploy at a time; a newer one cancels an in-flight one
# rather than letting an older build finish last and win.
concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Build (staging)
        env:
          REACT_APP_API_URL: https://europe-west1-mamusialibrary-staging.cloudfunctions.net/appEurope/
          # package.json's "homepage" is the GitHub Pages path (/MamaWebsiteFront),
          # which CRA otherwise bakes into every asset URL. Firebase Hosting serves
          # from the root, so override it back to "/" for this build only.
          PUBLIC_URL: /
          CI: false
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_STAGING_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting (staging)
        run: npx firebase-tools deploy --only hosting --project staging --non-interactive
